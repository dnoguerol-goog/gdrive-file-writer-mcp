[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrive-file-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for writing files to Google Shared Drive via Gemini Enterprise Workflow Builder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Google LLC" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "starlette>=0.38.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "google-api-python-client>=2.130.0,<3.0.0",
    "google-auth>=2.30.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
